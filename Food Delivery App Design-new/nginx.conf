server {
    listen       80;
    server_name  localhost;

    # Compress responses for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # This is critical for Single Page Applications (SPA) like React/Vite.
        # If a requested file doesn't exist, route the request back to index.html
        # so React Router can handle it on the client side.
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets forever (Vite adds content hashes to filenames)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Disable caching for index.html so updates are visible immediately
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires 0;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
